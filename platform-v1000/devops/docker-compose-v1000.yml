version: '3.9'

services:
  postgres-core:
    image: postgres:16
    container_name: ad-v1000-postgres-core
    restart: unless-stopped
    environment:
      POSTGRES_DB: akul_dravin_hrms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_core_data:/var/lib/postgresql/data

  timescaledb-analytics:
    image: timescale/timescaledb:latest-pg16
    container_name: ad-v1000-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: akul_dravin_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - timescale_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ad-v1000-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: ad-v1000-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - '9200:9200'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  backend-api:
    build:
      context: ../../backend/hrms-microservices
      dockerfile: Dockerfile
    container_name: ad-v1000-backend
    restart: unless-stopped
    environment:
      PORT: 4200
      DB_HOST: postgres-core
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: akul_dravin_hrms
      JWT_SECRET: change_this_for_production
      JWT_EXPIRES_IN_SECONDS: 43200
    depends_on:
      - postgres-core
      - redis
      - elasticsearch
    ports:
      - '4200:4200'

  ai-engine:
    build:
      context: ../../backend/ai-engine-fastapi
      dockerfile: Dockerfile
    container_name: ad-v1000-ai-engine
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: '1'
    ports:
      - '8000:8000'

  frontend-web:
    build:
      context: ../../frontend-next
      dockerfile: Dockerfile
    container_name: ad-v1000-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4200/api/v1
      NEXT_PUBLIC_NOTIFICATIONS_WS_URL: ws://localhost:4200/ws
    depends_on:
      - backend-api
    ports:
      - '3000:3000'

volumes:
  postgres_core_data:
  timescale_data:
  elasticsearch_data:

