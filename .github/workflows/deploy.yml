name: Deploy — Railway

on:
  push:
    branches:
      - staging   # → auto-deploy to staging
      - main      # → auto-deploy to production

  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false   # Never cancel an in-progress deploy

jobs:
  # ── CI gate (must pass before any deploy) ──────────────────────────────────
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ── Resolve environment name ───────────────────────────────────────────────
  resolve-env:
    name: Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          fi

  # ── Deploy backend ─────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Railway
    runs-on: ubuntu-latest
    needs: [ci-gate, resolve-env]
    environment: ${{ needs.resolve-env.outputs.environment }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend to Railway
        working-directory: backend/hrms-microservices
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service hrms-backend \
            --environment ${{ needs.resolve-env.outputs.environment }} \
            --detach

      - name: Wait for backend health
        env:
          BACKEND_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          echo "Waiting for backend health check..."
          for i in $(seq 1 24); do
            STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" "${BACKEND_URL}/api/v1/health" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [[ "$STATUS" == "200" ]]; then
              echo "✅ Backend healthy"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Backend health check timed out after 4 minutes"
          exit 1

  # ── Deploy frontend ────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Railway
    runs-on: ubuntu-latest
    needs: [ci-gate, resolve-env, deploy-backend]
    environment: ${{ needs.resolve-env.outputs.environment }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy frontend to Railway
        working-directory: frontend-next
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service hrms-frontend \
            --environment ${{ needs.resolve-env.outputs.environment }} \
            --detach

      - name: Wait for frontend health
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_HEALTH_URL }}
        run: |
          echo "Waiting for frontend health check..."
          for i in $(seq 1 18); do
            STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" "${FRONTEND_URL}" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [[ "$STATUS" == "200" ]]; then
              echo "✅ Frontend healthy"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Frontend health check timed out after 3 minutes"
          exit 1

  # ── Smoke test (production only) ───────────────────────────────────────────
  smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, resolve-env]
    if: needs.resolve-env.outputs.environment == 'production'

    steps:
      - name: Auth endpoint reachable
        env:
          BACKEND_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" "${BACKEND_URL}/api/v1/health")
          [[ "$STATUS" == "200" ]] || (echo "Smoke test failed: $STATUS" && exit 1)
          echo "✅ Production smoke test passed"

  # ── Deployment summary ─────────────────────────────────────────────────────
  notify:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, resolve-env]
    if: always()

    steps:
      - name: Report status
        run: |
          ENV="${{ needs.resolve-env.outputs.environment }}"
          BACKEND="${{ needs.deploy-backend.result }}"
          FRONTEND="${{ needs.deploy-frontend.result }}"
          echo "=== DEPLOYMENT SUMMARY ==="
          echo "Environment : $ENV"
          echo "Backend     : $BACKEND"
          echo "Frontend    : $FRONTEND"
          echo "Commit      : ${{ github.sha }}"
          echo "=========================="
          [[ "$BACKEND" == "success" && "$FRONTEND" == "success" ]] || exit 1
