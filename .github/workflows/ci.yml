name: CI — Build & Test

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # Cancel stale runs on new push

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hrms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      PORT: 4001
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: hrms_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-test-secret-not-for-production
      SKIP_MICROSERVICES: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/hrms-microservices/package-lock.json

      - name: Install backend dependencies
        working-directory: backend/hrms-microservices
        run: npm ci --frozen-lockfile

      - name: TypeScript compile check
        working-directory: backend/hrms-microservices
        run: npx tsc --noEmit

      - name: Governance static analysis scan
        working-directory: backend/hrms-microservices
        run: |
          npm run governance:scan:sarif > governance-results.sarif 2>&1 || SCAN_EXIT=$?
          echo "Governance scan exit code: ${SCAN_EXIT:-0}"
          # Exit code semantics:
          #   0 = clean
          #   1 = critical violations  → fail CI
          #   2 = high violations      → fail CI (--no-exit-on-high not set)
          #   3 = medium only          → informational, non-blocking
          if [ "${SCAN_EXIT:-0}" -le 2 ] && [ "${SCAN_EXIT:-0}" -gt 0 ]; then
            cat governance-results.sarif
            exit ${SCAN_EXIT}
          fi
          exit 0
        env:
          NODE_ENV: test

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/hrms-microservices/governance-results.sarif
          category: governance-scanner
        continue-on-error: true  # SARIF upload is non-blocking if Code Scanning not enabled

      - name: Upload governance SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-sarif-${{ github.sha }}
          path: backend/hrms-microservices/governance-results.sarif
          retention-days: 30

      - name: Run unit tests
        working-directory: backend/hrms-microservices
        run: npm run test -- --passWithNoTests --forceExit

      - name: Build production bundle
        working-directory: backend/hrms-microservices
        run: npm run build

      - name: Docker build validation
        run: |
          docker build \
            --target production \
            --file backend/hrms-microservices/Dockerfile \
            --tag hrms-backend:ci-${{ github.sha }} \
            backend/hrms-microservices

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4001/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-next
        run: npm ci --frozen-lockfile

      - name: TypeScript compile check
        working-directory: frontend-next
        run: npx tsc --noEmit

      - name: Next.js production build
        working-directory: frontend-next
        run: npm run build

      - name: Docker build validation
        run: |
          docker build \
            --target runner \
            --file frontend-next/Dockerfile \
            --tag hrms-frontend:ci-${{ github.sha }} \
            frontend-next

  # ── E2E Integration Tests ──────────────────────────────────────────────────
  e2e:
    name: E2E — Critical Business Flows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hrms_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:4001
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4001/api/v1
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: hrms_e2e
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: e2e-ci-secret
      SKIP_MICROSERVICES: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend-next/package-lock.json
            backend/hrms-microservices/package-lock.json

      - name: Install root workspace deps
        run: npm ci --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install backend deps
        working-directory: backend/hrms-microservices
        run: npm ci --frozen-lockfile

      - name: Run DB migrations
        working-directory: backend/hrms-microservices
        run: npm run migration:run
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: hrms_e2e

      - name: Start backend (background)
        working-directory: backend/hrms-microservices
        run: |
          npm run build
          node dist/main.js &
          sleep 10
          curl -s http://localhost:4001/api/v1/health || echo "Backend health check failed, continuing..."

      - name: Install frontend deps
        working-directory: frontend-next
        run: npm ci --frozen-lockfile

      - name: Build frontend
        working-directory: frontend-next
        run: npm run build

      - name: Start frontend (background)
        working-directory: frontend-next
        run: npx next start -p 3000 &

      - name: Wait for servers
        run: |
          npx wait-on http://localhost:3000 http://localhost:4001/api/v1/health --timeout 60000

      - name: Run Playwright E2E (API tests only in CI, no auth state)
        run: |
          npx playwright test e2e/critical-flows.spec.ts \
            --project=chromium \
            --reporter=list,html,json \
            --timeout=30000 || true
        env:
          E2E_API_URL: http://localhost:4001
          E2E_ADMIN_TOKEN: ${{ secrets.E2E_ADMIN_TOKEN || 'ci-fallback-token' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: e2e/reports/
          retention-days: 14

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-${{ github.sha }}
          path: test-results/
          retention-days: 7
