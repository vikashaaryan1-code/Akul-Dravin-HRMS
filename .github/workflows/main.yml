name: PUERI Ultra CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── BUILD & TEST ──────────────────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Backend Build & Lint
        run: |
          cd backend/hrms-microservices
          npm run lint
          npm run build
          npm test

      - name: Frontend Build & Lint
        run: |
          cd frontend-next
          npm run lint
          npm run build

  # ─── DOCKER PRODUCTION PUSH ────────────────────────────────────────────────
  docker-deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend/hrms-microservices
          file: ./backend/hrms-microservices/Dockerfile.prod
          push: true
          tags: pueri/backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend-next
          file: ./frontend-next/Dockerfile.prod
          push: true
          tags: pueri/frontend:latest

  # ─── PRODUCTION RELEASE ────────────────────────────────────────────────────
  production-rollout:
    needs: docker-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production Cluster
        run: echo "Initiating Blue-Green Deployment to Kubernetes/Docker Swarm..."
