# Railway service config — Frontend (Next.js)
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm run start -- -p 3000"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ── Environment variables configured via Railway dashboard / CLI ───────────────
# Required vars (set in Railway → Variables tab for each environment):
#
# NODE_ENV                    = production
# NEXT_PUBLIC_API_BASE_URL    = https://api.akuldravin.com/api/v1
