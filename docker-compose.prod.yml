version: '3.8'

services:
  # ─── API Layer (NestJS) ─────────────────────────────────────────────────────
  api:
    image: pueri-backend:latest
    build:
      context: ./backend/hrms-microservices
      dockerfile: Dockerfile.prod
    env_file: .env.prod
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    restart: always
    networks:
      - pueri-network

  # ─── Frontend Layer (Next.js) ────────────────────────────────────────────────
  frontend:
    image: pueri-frontend:latest
    build:
      context: ./frontend-next
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - api
    restart: always
    networks:
      - pueri-network

  # ─── Database (PostgreSQL) ──────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pueri_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    networks:
      - pueri-network

  # ─── Queue & Cache (Redis) ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    restart: always
    networks:
      - pueri-network

  # ─── Reverse Proxy (NGINX + SSL) ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - api
    restart: always
    networks:
      - pueri-network

networks:
  pueri-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
