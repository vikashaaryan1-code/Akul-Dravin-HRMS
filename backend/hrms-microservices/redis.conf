# ─────────────────────────────────────────────────────────────────────────────
# redis.conf — Production Redis configuration for Akul Dravin HRMS
#
# Usage:
#   docker run -p 6379:6379 -v $(pwd)/redis.conf:/usr/local/etc/redis/redis.conf \
#     redis redis-server /usr/local/etc/redis/redis.conf
#
# For Upstash / Redis Cloud: apply these settings via the dashboard.
# ─────────────────────────────────────────────────────────────────────────────

# ── Persistence ───────────────────────────────────────────────────────────────
# AOF: write-ahead log — recovers BullMQ job state after Redis restart.
# everysec: fsync every second — balanced durability vs performance.
# RDB snapshot kept as backup (every 15 min if 1+ key changed).
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
save 900 1
save 300 10

# ── Memory Management ─────────────────────────────────────────────────────────
# allkeys-lru: evict least-recently-used keys when memory is full.
# This means completed/stale BullMQ jobs are evicted before active ones.
# Set maxmemory appropriate for your host — adjust via env/orchestration.
maxmemory-policy allkeys-lru

# ── Connection Health ─────────────────────────────────────────────────────────
# Detect dead connections every 300 seconds.
tcp-keepalive 300

# ── Slow Log ──────────────────────────────────────────────────────────────────
# Log commands slower than 10ms — useful during Artillery test review.
slowlog-log-slower-than 10000
slowlog-max-len 128

# ── Security (baseline) ───────────────────────────────────────────────────────
# Bind to localhost only for development. In production: set bind + requirepass.
# bind 127.0.0.1
# requirepass your_strong_password_here
