<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Akul Dravin HRMS</title>
  <desc id="logoDesc">Akul Dravin HRMS geometric diamond logo with crimson and gold branding</desc>
  <defs>
    <linearGradient id="brandMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7335d"/>
      <stop offset="100%" stop-color="#8a112d"/>
    </linearGradient>
    <linearGradient id="brandDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b3193f"/>
      <stop offset="100%" stop-color="#730a23"/>
    </linearGradient>
    <linearGradient id="goldMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2d1b1"/>
      <stop offset="100%" stop-color="#c7ab77"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c39f62"/>
      <stop offset="50%" stop-color="#ddc497"/>
      <stop offset="100%" stop-color="#c39f62"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6f0f2a" flood-opacity="0.26"/>
    </filter>
  </defs>

  <g transform="translate(280 46)" filter="url(#shadow)">
    <polygon points="0,-34 34,0 0,34 -34,0" fill="url(#brandMain)"/>
    <polygon points="0,-26 26,0 0,26 -26,0" fill="url(#goldMain)"/>
    <polygon points="0,-34 34,0 8,0" fill="#e0466a" opacity="0.95"/>
    <polygon points="0,34 -34,0 -8,0" fill="url(#brandDeep)"/>
    <polygon points="0,-26 0,26 -26,0" fill="#d8c39c" opacity="0.9"/>
    <polygon points="0,-26 26,0 0,0" fill="#eadfc9" opacity="0.9"/>
  </g>

  <text
    x="280"
    y="120"
    text-anchor="middle"
    font-family="'Montserrat', 'Segoe UI', Arial, sans-serif"
    font-size="54"
    letter-spacing="1.6"
    fill="#8a102d"
  >AKUL DRAVIN</text>

  <line x1="78" y1="141" x2="226" y2="141" stroke="url(#goldLine)" stroke-width="4" stroke-linecap="round"/>
  <line x1="334" y1="141" x2="482" y2="141" stroke="url(#goldLine)" stroke-width="4" stroke-linecap="round"/>
  <line x1="78" y1="152" x2="226" y2="152" stroke="url(#goldLine)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <line x1="334" y1="152" x2="482" y2="152" stroke="url(#goldLine)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <text
    x="280"
    y="152"
    text-anchor="middle"
    font-family="'Montserrat', 'Segoe UI', Arial, sans-serif"
    font-size="44"
    letter-spacing="2"
    fill="#821129"
  >HRMS</text>
</svg>
