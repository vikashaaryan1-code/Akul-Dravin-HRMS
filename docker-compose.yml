version: '3.9'

# ── Shared logging config (apply to all services) ────────────────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    container_name: akul-dravin-postgres
    restart: always
    environment:
      POSTGRES_DB: akul_dravin_hrms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d akul_dravin_hrms']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: akul-dravin-redis
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
        reservations:
          memory: 128M
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  backend:
    build:
      context: ./backend/hrms-microservices
      dockerfile: Dockerfile
      target: production             # Uses multi-stage build production stage
    container_name: akul-dravin-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_NAME: akul_dravin_hrms
      # Explicit override — prevents env_file from silently supplying wrong password.
      # ${DB_PASSWORD} is resolved from root .env via Compose variable substitution.
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: info
      SKIP_MICROSERVICES: 'true'
    env_file:
      - .env                          # DB_PASSWORD, JWT_SECRET loaded from .env
    ports:
      - '4001:4001'
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          memory: 256M
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:4001/api/v1/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
      target: runner                  # Uses multi-stage build runner stage
    container_name: akul-dravin-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:4001
    ports:
      - '3000:3000'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    container_name: akul-dravin-nginx
    restart: always
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/nginx/certs
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

secrets:
  db_password:
    file: ./secrets/db_password.txt  # Create this file; never commit it

volumes:
  postgres_data:
  redis_data:
  nginx_certs:
