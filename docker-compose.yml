version: '3.8'

services:
  backend:
    build:
      context: ./backend/hrms-microservices
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/akul_dravin_hrms?schema=public
    depends_on:
      - redis
      postgres:
        condition: service_healthy
    networks:
      - akul-dravin-network

  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:4000
    depends_on:
      - backend
    networks:
      - akul-dravin-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - akul-dravin-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=akul_dravin_hrms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - akul-dravin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d akul_dravin_hrms"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  postgres_data:

networks:
  akul-dravin-network:
    driver: bridge
