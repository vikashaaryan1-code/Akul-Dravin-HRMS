version: '3.9'

# ═══════════════════════════════════════════════════════════════════════════
# AKUL DRAVIN HRMS AI — Full Stack Docker Compose
# 
# Copy .env.example → .env and set all required values before running.
#
# Usage:
#   Development:  docker compose up
#   Production:   docker compose up -d
#   Rebuild:      docker compose up --build -d
# ═══════════════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL with pgvector ───────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hrms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hrms_development}
      POSTGRES_USER: ${DB_USER:-hrms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hrms_user} -d ${DB_NAME:-hrms_development}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hrms_net

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hrms_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hrms_net

  # ── Node.js Backend API ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrms_backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HRMS_API_PORT: 4100
      HRMS_API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${DB_USER:-hrms_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-hrms_development}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "4100:4100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4100/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - hrms_net

  # ── FastAPI AI Engine ─────────────────────────────────────────────────────
  ai-engine:
    build:
      context: ./backend/ai-engine-fastapi
      dockerfile: Dockerfile
    container_name: hrms_ai_engine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-hrms_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-hrms_development}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AI_API_KEY: ${AI_ENGINE_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - hrms_net

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Akul Dravin HRMS}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4100}
    container_name: hrms_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - hrms_net

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  hrms_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
