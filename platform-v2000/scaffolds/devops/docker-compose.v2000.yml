version: '3.9'

services:
  api-gateway:
    image: akuldravin/api-gateway:v2000
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=production
      - JWT_ISSUER=akdravin-bos

  auth-service:
    image: akuldravin/auth-service:v2000
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis

  employee-service:
    image: akuldravin/employee-service:v2000
    environment:
      - DB_HOST=postgres

  crm-service:
    image: akuldravin/crm-service:v2000
    environment:
      - DB_HOST=postgres

  finance-accounting-service:
    image: akuldravin/finance-accounting-service:v2000
    environment:
      - DB_HOST=postgres

  analytics-service:
    image: akuldravin/analytics-service:v2000
    environment:
      - ELASTIC_HOST=elasticsearch

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=akul_dravin_v2000
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    environment:
      - discovery.type=single-node

volumes:
  pgdata:
