apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-orchestrator
  namespace: akul-v39
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-orchestrator
  template:
    metadata:
      labels:
        app: ai-orchestrator
    spec:
      containers:
        - name: ai-orchestrator
          image: akuldravin/ai-orchestrator:v39.0.0
          ports:
            - containerPort: 8100
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-orchestrator
  namespace: akul-v39
spec:
  selector:
    app: ai-orchestrator
  ports:
    - name: http
      port: 8100
      targetPort: 8100
  type: ClusterIP
