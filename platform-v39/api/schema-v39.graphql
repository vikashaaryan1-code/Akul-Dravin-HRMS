schema {
  query: Query
  mutation: Mutation
}

type Query {
  me: User
  companies: [Company!]!
  employees(companyId: ID!): [Employee!]!
  jobs(status: String): [Job!]!
  reports(category: String!): [Report!]!
  aiModels(domain: String): [AIModel!]!
}

type Mutation {
  createCompany(input: CreateCompanyInput!): Company!
  createEmployee(input: CreateEmployeeInput!): Employee!
  createLeaveRequest(input: CreateLeaveRequestInput!): LeaveRequest!
  createJob(input: CreateJobInput!): Job!
  createMarketplaceListing(input: CreateMarketplaceListingInput!): MarketplaceListing!
  runPayroll(input: RunPayrollInput!): PayrollRun!
  routeAI(input: AIRouteInput!): AIRouteResponse!
}

type User {
  id: ID!
  email: String!
  fullName: String!
  role: String!
}

type Company {
  id: ID!
  code: String!
  name: String!
}

type Employee {
  id: ID!
  employeeCode: String!
  fullName: String!
  status: String!
}

type LeaveRequest {
  id: ID!
  status: String!
}

type Job {
  id: ID!
  title: String!
  status: String!
}

type MarketplaceListing {
  id: ID!
  visibility: String!
  status: String!
}

type PayrollRun {
  id: ID!
  status: String!
}

type AIRouteResponse {
  targetService: String!
  status: String!
}

type Report {
  id: ID!
  title: String!
  category: String!
}

type AIModel {
  id: ID!
  modelKey: String!
  domain: String!
  status: String!
}

input CreateCompanyInput {
  code: String!
  name: String!
}

input CreateEmployeeInput {
  companyId: ID!
  employeeCode: String!
  fullName: String!
}

input CreateLeaveRequestInput {
  employeeId: ID!
  leaveTypeId: ID!
  startDate: String!
  endDate: String!
  totalDays: Float!
}

input CreateJobInput {
  companyId: ID!
  title: String!
  description: String!
}

input CreateMarketplaceListingInput {
  jobId: ID!
  visibility: String
}

input RunPayrollInput {
  companyId: ID!
  month: Int!
  year: Int!
}

input AIRouteInput {
  capability: String!
  payload: String!
}
